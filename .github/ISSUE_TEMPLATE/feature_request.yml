name: Feature request
description: Suggest a capability Device Routines does not have yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to achieve, and what stops you today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do
    validations:
      required: true
