name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The manifest version must match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # A beta tag (v0.3.0-beta.1) carries the version it previews (decision L33).
          release="${tag%%-beta.*}"
          version=$(python3 -c 'import json; print(json.load(open("custom_components/device_routines/manifest.json"))["version"])')
          if [ "$release" != "$version" ]; then
            echo "::error::tag v$tag does not match manifest.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v5
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the console bundle
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend && npm ci && npm run build
      - name: Zip the integration
        run: |
          set -euo pipefail
          (cd custom_components/device_routines && zip -r ../../device_routines.zip . -x '*__pycache__*' -x '.deployed')
          unzip -l device_routines.zip | tail -1
      - name: Collect the release notes from the changelog
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="${tag%%-beta.*}"
          python3 - "$version" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(match.group(1).strip() if match else f"Release {version}.")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: device_routines.zip
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
