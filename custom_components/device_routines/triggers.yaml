# Purpose specific triggers (PRD FR-R17). The target names routine devices: a device,
# an area, a label, a floor or an entity of a device a routine can drive. The domains are
# the domain profiles of domains.py; a test keeps the two lists equal.
.trigger_common: &trigger_common
  target:
    entity:
      - domain:
          - climate
          - cover
          - fan
          - humidifier
          - input_boolean
          - lawn_mower
          - light
          - lock
          - media_player
          - switch
          - vacuum
          - valve
  fields:
    behavior:
      required: true
      default: each
      selector:
        automation_behavior:
          mode: trigger

action_skipped: *trigger_common
paused: *trigger_common
resumed: *trigger_common
